openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser authentication endpoints.
  - name: Game
    description: Player game-state persistence.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /game/user/{userId}:
    get:
      tags: [Game]
      operationId: getPlayerGameData
      summary: Load persisted state for a player
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Player state, or defaults when no state has been saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGameData'
        '400':
          description: Invalid player identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /game/position:
    post:
      tags: [Game]
      operationId: savePlayerGameData
      summary: Persist a player's current state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlayerGameDataRequest'
      responses:
        '200':
          description: State saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDataSaveResult'
        '400':
          description: Invalid player state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    PlayerGameData:
      type: object
      required: [x, y, points, upgrades]
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 29
        y:
          type: integer
          minimum: 0
          maximum: 19
        points:
          type: integer
          minimum: 0
          maximum: 2147483647
        upgrades:
          type: string
    SavePlayerGameDataRequest:
      allOf:
        - $ref: '#/components/schemas/PlayerGameData'
        - type: object
          required: [userId]
          properties:
            userId:
              type: string
              minLength: 1
    GameDataSaveResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
