<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Pixel Grid — Cooperative Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080812;
      color: #ccc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
      padding: 8px;
    }
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 8px;
      border-bottom: 1px solid #1a1a36;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: clamp(12px, 3vw, 18px);
      letter-spacing: 3px;
      color: #7b8ff5;
      text-transform: uppercase;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #status {
      font-size: clamp(10px, 2.5vw, 12px);
      color: #55cc88;
      background: #0d1a0d;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #1a3a1a;
      white-space: nowrap;
    }
    #logout-btn, #login-btn {
      display: none;
      font-size: clamp(10px, 2.5vw, 11px);
      font-family: 'Courier New', monospace;
      background: transparent;
      border: 1px solid #333;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }
    #logout-btn { color: #888; }
    #logout-btn:hover { color: #ccc; border-color: #666; }
    #login-btn  { color: #7b8ff5; border-color: #2a2a5a; }
    #login-btn:hover { color: #aabbff; border-color: #4a4a8a; }
    #canvas-wrap {
      border: 2px solid #1e1e3a;
      box-shadow: 0 0 40px rgba(100, 100, 255, 0.08);
      flex-shrink: 0;
    }
    #gameCanvas { display: block; image-rendering: pixelated; }
    footer {
      margin-top: 8px;
      font-size: clamp(9px, 2vw, 11px);
      color: #444466;
      text-align: center;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    footer span { color: #6666aa; }
  </style>
</head>
<body>
  <header>
    <h1>Pixel Grid</h1>
    <div class="header-right">
      <div id="status">Checking login…</div>
      <a id="login-btn" href="/api/login?returnTo=/">Log in</a>
      <button id="logout-btn" onclick="location.href='/api/logout'">Log out</button>
    </div>
  </header>
  <div id="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
  </div>
  <footer>
    Players move automatically every second &nbsp;·&nbsp;
    Eat yellow pellets for bonus points &nbsp;·&nbsp;
    Built with <span>Scala + Scala.js</span>
  </footer>
  <script src="/main.js"></script>
</body>
</html>
