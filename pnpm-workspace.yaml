# Delay new package releases to reduce supply-chain risk.
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*

catalog:
  '@types/node': ^25.3.3
  drizzle-orm: ^0.45.2
  vite: ^7.3.2
  zod: ^3.25.76

autoInstallPeers: false

allowBuilds:
  esbuild: true

overrides:
  # drizzle-kit still depends on the deprecated esbuild-kit loader.
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.28.1"
